services:
  postgres:
    image: postgres:16-alpine
    container_name: gelu-menu-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gelu_menu}
      POSTGRES_USER: ${POSTGRES_USER:-gelu_menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gelu_menu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gelu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gelu_menu} -d ${POSTGRES_DB:-gelu_menu}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: gelu-menu-minio
    env_file:
      - ../.env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gelu_menu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gelu_menu123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: gelu-menu-backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gelu_menu}
      DATABASE_USERNAME: ${POSTGRES_USER:-gelu_menu}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-gelu_menu}
      JWT_SECRET: ${JWT_SECRET:-gelu-menu-local-development-secret-change-me}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-30d}
      EXPOSE_PASSWORD_RESET_TOKEN: ${EXPOSE_PASSWORD_RESET_TOKEN:-true}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-30m}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-gelu_menu}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gelu_menu123}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-gelu-menu-media}
      STORAGE_PROXY_BASE_PATH: ${STORAGE_PROXY_BASE_PATH:-/api/v1/recipes}
      STORAGE_MAX_IMAGE_SIZE_BYTES: ${STORAGE_MAX_IMAGE_SIZE_BYTES:-5242880}
      GELU_SUPER_ADMIN_EMAIL: ${GELU_SUPER_ADMIN_EMAIL:-luanvitors_852@hotmail.com}
      GELU_SUPER_ADMIN_PASSWORD: ${GELU_SUPER_ADMIN_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    container_name: gelu-menu-frontend
    env_file:
      - ../.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  backoffice:
    build:
      context: ../backoffice
    container_name: gelu-menu-backoffice
    env_file:
      - ../.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "127.0.0.1:${BACKOFFICE_PORT:-3001}:3000"
    depends_on:
      - backend

volumes:
  gelu_postgres_data:

